metadata:
  version: 1.0
  status: Draft
  last_updated: 2026-08-02
  release: true

title: Birds Perched
inherits: baseline

card:
  icons:
    left: bird_perched
  field_setup:
    start: C1
    source_profile: Wildlife
  colors:
    background:
    text:

overrides:
  shutter:
    target: "1/500–1/1000"

  lens:
    aperture:
      target: f/8

  exposure:
    exposure_compensation: "0 to +1/3"

checklist:
  - Servo AF
  - Eye detected
  - Background checked
  - Histogram

watch_for:
  - Branches
  - Bird preparing to launch

common_mistakes:
  - Shutter too slow
  - Too much depth of field

notes:
  - Use Spot AF or 1-Point AF when branches interfere; use Expand AF Area when movement is difficult to follow.
  - Image Stabilization Mode 1 is correct for handheld perched birds; turn IS off on a solid tripod.
appendix_links:
  - id: r5_quick_reference
    label: When to use 1.6× crop mode
