card_id: 61b4fa46-fe43-50a8-ba94-5087ba532cb6
metadata:
  version: 1.0
  status: Draft
  last_updated: 2026-08-20
  release: true
title: Birds Perched
inherits: baseline
card:
  icons:
    left: bird_perched
  field_setup:
    start: C1
    source_card_id: 3f9e95b6-7c08-5ca0-89a7-ad3f878bbc42
    my_menus:
    - name: AF Case
      settings:
      - autofocus.servo_af_case
      - autofocus.tracking_sensitivity
      - autofocus.accel_decel_tracking
      - autofocus.switching_tracked_subjects
    - name: SWITCH
      settings:
      - autofocus.subject_detection
      - shutter.type
      - stabilization.image_stabilization.mode
  colors:
    background: null
    text: null
overrides:
  autofocus:
    servo_af_case: Case 1 (Custom)
    tracking_sensitivity: '-1'
    accel_decel_tracking: '+1'
  shutter:
    target: 1/500–1/1000
  lens:
    aperture:
      target: f/8
  exposure:
    exposure_compensation: 0 to +1/3
checklist:
- Servo AF
- Eye detected
- Background checked
- Histogram
watch_for:
- Branches
- Bird preparing to launch
common_mistakes:
- Shutter too slow
- Too much depth of field
notes:
- Case 1 is the project-customized -1 / +1 preset, not Canon's factory 0 / 0 Case 1.
- Use Spot AF or 1-Point AF when branches interfere; use Expand AF Area when movement is difficult to follow.
- Image Stabilization Mode 1 is correct for handheld perched birds; turn IS off on a solid tripod.
appendix_links:
