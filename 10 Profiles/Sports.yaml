title: Sports
inherits: baseline
card:
  icons:
    left: sports
  field_setup:
    start: C2
    source_card_id: d2609cc6-8056-5632-932d-45dcb4416185
    my_menus:
    - name: SWITCH
      settings:
      - autofocus.subject_detection
      - shutter.type
      - stabilization.image_stabilization.mode
    - name: AF Case
      settings:
      - autofocus.servo_af_case
      - autofocus.tracking_sensitivity
      - autofocus.accel_decel_tracking
      - autofocus.switching_tracked_subjects
  colors:
    background: null
    text: null
overrides:
  exposure:
    mode: Tv
  autofocus:
    servo_af_case: Case 1 (Custom)
    tracking_sensitivity: '-1'
    accel_decel_tracking: '+1'
    subject_detection: People
  drive:
    mode: High Speed Continuous+
  shutter:
    type: Mechanical
    target: 1/1000–1/2000 outdoor; 1/640–1/1000 indoor
  stabilization:
    image_stabilization:
      mode: Mode 3
checklist:
- Servo AF
- Subject acquired
- Check flicker/banding under artificial light
watch_for:
- Motion blur
- Artificial-light flicker or banding
common_mistakes:
- Shutter too slow
notes:
- Case 1 is the project-customized -1 / +1 preset, not Canon's factory 0 / 0 Case 1.
- Use People detection and Face + Tracking for people sports.
- For motorsports or other vehicle-based sports, change Subject Detection situationally from People to Vehicles; this is a field change within Sports, not a separate profile.
- Switch to Expand AF Area if detection is unreliable.
- Use faster shutter speeds for very fast action and slower speeds when indoor light requires a compromise.
- Use IS Mode 3 for erratic action; switch to Mode 2 only for deliberate panning.
