metadata:
  version: 1.0
  status: Draft
  last_updated: 2026-08-20
  release: false
title: Waterdrops
card:
  icons:
    left: water_drops
  field_setup:
    start: C3
    source_profile: Landscape
    my_menus:
    - name: SWITCH
      settings:
      - shutter.type
      - stabilization.image_stabilization.mode
inherits: baseline
overrides:
  exposure:
    mode: Manual
    iso:
      mode: Fixed
      value: 100-400
  autofocus:
    operation: Manual Focus
    method: Not Used
    subject_detection: None
    eye_detection: Disable
  drive:
    mode: Single Shot
  shutter:
    type: Mechanical
    target: 1/200
  lens:
    aperture:
      target: f/8–f/11
  stabilization:
    image_stabilization:
      mode: 'Off'
    ibis: 'Off'
    lens_is: 'Off'
checklist:
- Pluto valve primed; liquid level and pressure stable
- Manual focus locked on a stand-in at the collision plane
- Multiple diffused flashes ready at about 1/16–1/64 power
- Pluto drop timing and camera-to-flash sync verified
watch_for:
- Ambient light
- Flash recycle consistency
- Reflections from each light or modifier
- Soap film refracting the collision plane
common_mistakes:
- Treating valve-open milliseconds as a measured drop volume
- Changing drop size, liquid depth, or viscosity without recalibrating timing
- Using f/22 and high ISO before optimizing flash distance and power
notes:
- In the current setup, Pluto controls the valve timing and fires the camera; the camera then fires the flashes. Recheck timing after changing any trigger or shutter connection.
- At 1/200, the short manual-flash duration freezes the collision. Start at ISO 100, f/8–f/11, and about 1/16–1/64 power; raise ISO only when flash placement and distance cannot supply enough exposure.
- Form any soap bubble first, place a temporary target at the collision plane, focus with magnified Live View, then lock manual focus. A changing curved soap film can still shift or distort the apparent plane.
