metadata:
  version: 1.0
  status: Draft
  last_updated: 2026-08-20
  release: false
title: Macro
inherits: baseline
card:
  icons:
    left: macro
  field_setup:
    start: C3
    source_profile: Landscape
    my_menus:
    - name: SWITCH
      settings:
      - image.focus_bracketing
      - autofocus.subject_detection
      - shutter.type
      - stabilization.image_stabilization.mode
  colors:
    background: null
    text: null
overrides:
  exposure:
    mode: Av
  image:
    focus_bracketing: Enable
  lens:
    aperture:
      target: f/8
  autofocus:
    operation: One-Shot AF
    method: Spot AF
    subject_detection: None
    eye_detection: Disable
  drive:
    mode: Single Shot
checklist:
- Stable support
- Focus bracketing enabled
- Start focus on nearest important detail
- Focus confirmed
watch_for:
- Extremely shallow depth of field
common_mistakes:
- Camera movement
notes:
- Use manual focus when appropriate.
- Focus bracketing is the starting point for macro; begin around f/8, increment 1-3, and 80-200 shots, then adjust for magnification and subject depth.
appendix_links:
- id: focus_bracketing_depth_compositing
  label: Focus Bracketing & In-Camera Depth Compositing appendix
