metadata:
  version: 1.0
  status: Draft
  last_updated: 2026-08-02
  release: true
title: People
card:
  icons:
    left: people
  field_setup:
    start: C1
    source_profile: Wildlife
    my_menus:
      - name: SWITCH
        settings:
          - shutter.type
          - autofocus.subject_detection
inherits: baseline
overrides:
  autofocus:
    subject_detection: People
  drive:
    mode: Low Speed Continuous
  shutter:
    type: Mechanical
    target: 1/200–1/320 portraits; 1/500+ action
  lens:
    aperture:
      target: f/1.8–f/4 single; f/4–f/8 groups
checklist:
  - Eye detected
  - Catchlight in eyes
  - Review depth of field
watch_for:
  - Distracting backgrounds
common_mistakes:
  - Focus on nose instead of eye
notes:
  - Use short bursts to capture expressions without filling the buffer unnecessarily.
  - Consider Av for intentional portraits; use Fv for casual family and event people photography.
