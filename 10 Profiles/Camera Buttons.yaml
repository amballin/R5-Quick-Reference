title: Camera Buttons
subtitle: Confirmed Layout + Approved Target
display_category: reference
display_order: 10
card_type: reference
card:
  icons:
    left: camera_default
reference_settings:
  - control: Shutter button half-press
    assignment: Metering start
  - control: AF-ON button
    assignment: Metering and AF start (Face + Tracking)
  - control: AE Lock button
    assignment: Metering and AF start (1-Point AF override; remembers last point position)
  - control: AF Point Selection button
    assignment: AF point selection; Main Dial changes selection; INFO toggles Eye detection when available
  - control: Lens AF button
    assignment: AF Off
  - control: SET button
    assignment: Eye detection toggle when supported by the active AF method
  - control: DOF button
    assignment: One-Shot AF ↔ Servo AF
  - control: Joystick
    assignment: Direct AF point selection; press straight in to recenter
  - control: Main Dial
    assignment: Shutter Speed
  - control: Rear Wheel
    assignment: Aperture
  - control: Top Rear Dial
    assignment: ISO Speed
  - control: Control Ring
    assignment: Exposure Compensation
  - control: M-Fn button
    assignment: Switch to Custom shooting mode (C1 → C2 → C3)
checklist:
  - Practice back-button AF before a critical shoot.
  - Use SET to choose eye priority before AF-ON when Face + Tracking is active.
  - Verify the C1-C3 registrations on the camera.
  - Use the linked deep dive for the green-star SWITCH My Menu starting tab.
  - Confirm Manual + Auto ISO before using exposure compensation.
  - Recheck assignments after a reset or firmware update.
watch_for:
  - Lock can disable configured dials, joystick, control ring, touchscreen across shooting modes
  - "AE Lock: 1-Point AF does not use Subject Detection or Eye Detection for that AF action; the stored profile settings remain unchanged"
  - SET has no effect when the active AF method cannot use Eye detection
  - AE Lock remembers the last 1-Point AF position; press the joystick straight in when recentering is needed
  - Exposure Compensation on Control Ring requires Auto ISO in Manual exposure
common_mistakes:
  - Expecting shutter half-press to autofocus after enabling back-button AF
  - Pressing AF-ON and AE Lock together instead of choosing one AF behavior
  - Expecting Eye Detection to operate with the 1-Point AF override
  - Expecting SET to toggle Eye detection while 1-Point AF or Spot AF is active
  - Assuming C1, C2, or C3 contains its documented profile without verifying the registration
