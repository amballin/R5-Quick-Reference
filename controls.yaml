camera: Canon EOS R5
status: owner_confirmed_layout_and_current_registrations
last_confirmed: 2026-08-23
approved_architecture_date: 2026-07-25
authority: Direct confirmation and approval from the project owner

evidence_rules:
  - Canon capability statements describe what the camera supports; they do not establish the chosen setup.
  - Owner-confirmed status applies only to entries physically verified on the camera.
  - Approved target assignments remain pending until physically verified on the camera.
  - Recommendations must be labeled as recommendations and must not be presented as current settings.
  - Unresolved items remain unresolved until the owner decides them.
  - IMG_6335 through IMG_6340 are retired historical evidence and are not reliable evidence of the current setup.

controls:
  - control: Shutter half-press
    assignment: Metering start
    status: owner_confirmed
  - control: AF-ON
    assignment: Metering and AF start
    status: owner_confirmed
    info_details:
      AF Operation: Maintain current setting
      AF Method: Face + Tracking
      Servo AF characteristics: Maintain current setting
    notes: Uses the stored Eye detection state, including a state changed with the SET button.
  - control: AE Lock
    assignment: Metering and AF start
    status: owner_confirmed
    info_details:
      AF Operation: Maintain current setting
      AF Method: 1-Point AF
      Servo AF characteristics: Maintain current setting
    notes: Uses the last 1-Point AF position; it does not automatically recenter the point.
  - control: AF Point Selection
    assignment: AF point selection
    operation: Use Main Dial to change selection; when Face + Tracking is active, INFO toggles Eye detection
    status: owner_confirmed
  - control: Lens AF button
    assignment: AF Off
    status: owner_confirmed
  - control: Depth-of-field preview
    assignment: One-Shot AF / Servo AF
    status: owner_confirmed
  - control: SET
    assignment: Eye detection
    status: owner_confirmed
    notes: Toggles the stored Eye detection state when the active AF method supports it; it has no effect with 1-Point AF or Spot AF.
  - control: Joystick
    assignment: Direct AF point selection
    operation: Move the AF point directly; press straight in to recenter it
    status: owner_confirmed
  - control: Movie Record
    assignment: Leave default
    status: owner_confirmed
  - control: MODE
    assignment: Leave default
    status: owner_confirmed
  - control: LCD panel illumination
    assignment: Leave default
    status: owner_confirmed
  - control: M-Fn
    assignment: Switch to Custom shooting mode
    operation: Press repeatedly to switch among C1, C2, and C3
    status: owner_confirmed
    notes: The assignment and C1-C3 switching behavior were physically tested. Current registration evidence is recorded separately below.

dials:
  - control: Main Dial
    assignment: Shutter Speed
    status: owner_confirmed
  - control: Rear Wheel
    assignment: Aperture
    status: owner_confirmed
  - control: Top Rear Dial
    assignment: ISO Speed
    status: owner_confirmed
  - control: Control Ring
    assignment: Exposure Compensation
    status: owner_confirmed

