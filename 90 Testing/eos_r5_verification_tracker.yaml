version: 1
title: EOS R5 Setup & Verification Tracker

lists:
  main_status:
    - Not started
    - In progress
    - Configured—not registered
    - Registered—pending read-back
    - Backup-Settings
    - Verified
    - Failed—needs correction
    - Inconclusive—needs retest
    - Blocked
    - Not applicable
  evidence_class:
    - Approved target pending verification
    - Owner-confirmed current configuration
    - Verified Canon capability
    - Project recommendation
    - Unresolved
  yes_no:
    - "Yes"
    - "No"
    - Not applicable
  registration_result:
    - Not started
    - Pass
    - Fail
    - Needs retest
    - Not applicable

tests:
  - test_id: SETUP-01
    sequence: 1
    phase: Camera Setup
    expected_result: A recoverable pre-test camera-settings file exists and its filename is recorded.
    task: Save the current complete camera configuration to the card.
    best_access: MENU
    menu_location: Set-up 5
    menu_detail: Save/load cam settings on card > Save to card
    next_action: Insert card and save the current configuration.
    evidence_class: Approved target pending verification
    project_update: "No"
    target_project_files: ""
  - test_id: SETUP-02
    sequence: 2
    phase: Camera Setup
    expected_result: Existing registrations are documented before any slot is overwritten.
    task: Record current C1, C2, and C3 contents before changing them.
    best_access: M-Fn recall; photograph or record
    menu_location: No menu
    menu_detail: Recall C1, C2, and C3 and photograph or record their settings
    next_action: Photograph or write down all three current slots.
    evidence_class: Approved target pending verification
    project_update: "No"
    target_project_files: ""
  - test_id: SETUP-03
    sequence: 3
    phase: Camera Setup
    expected_result: Temporary field changes cannot silently rewrite a registered custom mode.
    task: Set Custom shooting mode Auto update to Disable.
    best_access: MENU
    menu_location: Set-up 5
    menu_detail: Custom shooting mode (C1-C3) > Auto update set. > Disable
    observation: Auto update must remain disabled throughout.
    next_action: Open the Custom shooting mode menu and disable Auto update.
    evidence_class: Approved target pending verification
    project_update: "Yes"
    target_project_files: controls.md; Camera Setup Essentials; project memory
  - test_id: SETUP-MM-01
    sequence: 4
    phase: Camera Setup
    expected_result: The approved SWITCH My Menu tab exists with the five approved shortcuts in the correct order and one open position.
    task: Configure and verify the SWITCH My Menu tab before profile registration.
    best_access: My Menu
    menu_location: My Menu
    menu_detail: "Create tab SWITCH; register in order: Subject to detect, Shutter mode, Focus bracketing, IS (Image Stabilizer) mode, Cropping/aspect ratio; leave position 6 open"
    next_action: Configure SWITCH before shared defaults, controls, or C1–C3 registration.
    evidence_class: Approved target pending verification
    project_update: "Yes"
    target_project_files: 00 Master/setting_access.yaml; controls.md; Back-Button AF guide; project memory
  - test_id: SETUP-04
    sequence: 5
    phase: Camera Setup
    expected_result: Shared operational defaults match the complete C1-aligned reference baseline.
    task: Confirm Fv, shutter and aperture Auto, Auto ISO maximum 12800, Servo AF, Face + Tracking, Animals, Eye Detection Enable, High Speed Continuous, EFCS, Mode 1, cRAW, Full-frame, and Evaluative metering.
    best_access: Q screen; direct exposure controls; AF Point Selection button; MM-SWITCH for Subject to detect, Shutter mode, and Cropping/aspect ratio
    menu_location: Multiple
    menu_detail: "Direct/Q: Fv, shutter Auto, aperture Auto, Auto ISO, Servo AF, High Speed Continuous, Evaluative metering; AF1: AF method, Subject to detect, Eye detection; Shooting 1: Image quality and Cropping/aspect ratio; Shooting 2: ISO speed settings; Shooting 6: Shutter mode; Shooting menu: IS (Image Stabilizer) mode"
    next_action: Check Camera Setup Essentials and Camera Defaults.
    evidence_class: Approved target pending verification
    project_update: "Yes"
    target_project_files: 00 Master/baseline.yaml; Camera Setup Essentials
  - test_id: SETUP-05
    sequence: 6
    phase: Camera Setup
    expected_result: Exposure review tools are available in every profile.
    task: Confirm RGB histogram and highlight alert are enabled.
    best_access: MENU
    menu_location: Multiple
    menu_detail: "Shooting 7: Shooting info. disp. > Screen info. settings > Histogram > RGB; Playback 5: Highlight alert > Enable"
    next_action: Check display settings.
    evidence_class: Approved target pending verification
    project_update: "Yes"
    target_project_files: 00 Master/baseline.yaml; Camera Setup Essentials
  - test_id: SETUP-06
    sequence: 7
    phase: Camera Setup
    expected_result: Specialty functions do not interfere with the verification session.
    task: Confirm High ISO NR, Long Exposure NR, Continuous AF, Electronic full-time MF, and IBIS High Resolution Shot are Off.
    best_access: MENU
    menu_location: Multiple
    menu_detail: "Shooting 4: Long exp. noise reduction and High ISO speed NR; AF1: Continuous AF; AF menu: Lens electronic MF; Shooting 5: IBIS High resolution shot"
    next_action: Review Set & Forget settings.
    evidence_class: Approved target pending verification
    project_update: "Yes"
    target_project_files: 00 Master/baseline.yaml; Camera Setup Essentials
  - test_id: SETUP-07
    sequence: 8
    phase: Camera Setup
    expected_result: Manual-focus aid matches the approved setup.
    task: Confirm MF Peaking is On, Low, Red.
    best_access: MENU
    menu_location: AF menu
    menu_detail: "MF peaking settings > Peaking: On; Level: Low; Color: Red"
