metadata:
  version: 1
  camera: Canon EOS R5
  firmware_scope: "2.2.0 or later"
  capture_scope: still photos
  authority: Canon EOS R5 Advanced User Guide
  authority_url: https://cam.start.canon/en/C003/manual/html/index.html
  status: Prototype reference; not a replacement for on-camera verification
  default_status: Menu topology is Canon-verified; individual reset defaults remain working references unless the linked Canon page states them explicitly

settings:
  exposure.mode:
    section: exposure
    label: Mode
    control: select
    allow_custom: false
    source: https://cam.start.canon/en/C003/manual/html/index.html
    choices:
      - {value: "A+", label: "A+ — Scene Intelligent Auto", origin: canon}
      - {value: Fv, label: "Fv — Flexible-priority AE", origin: canon}
      - {value: P, label: "P — Program AE", origin: canon}
      - {value: Tv, label: "Tv — Shutter-priority AE", origin: canon}
      - {value: Av, label: "Av — Aperture-priority AE", origin: canon}
      - {value: M, label: "M — Manual exposure", origin: canon}
      - {value: Manual, label: "M — Manual exposure", origin: project_alias, canon_value: M}
      - {value: BULB, label: "BULB — Long exposure", origin: canon}
      - {value: C1, label: "C1 — Custom shooting mode 1", origin: canon, conditional: registered mode}
      - {value: C2, label: "C2 — Custom shooting mode 2", origin: canon, conditional: registered mode}
      - {value: C3, label: "C3 — Custom shooting mode 3", origin: canon, conditional: registered mode}

  exposure.metering:
    section: exposure
    label: Metering
    control: select
    allow_custom: false
    source: https://cam.start.canon/en/C003/manual/html/UG-03_Shooting-1_0400.html
    choices:
      - {value: Evaluative, label: Evaluative metering, origin: canon}
      - {value: Partial, label: Partial metering, origin: canon}
      - {value: Spot, label: Spot metering, origin: canon}
      - {value: Center-weighted average, label: Center-weighted average, origin: canon}

  exposure.iso.mode:
    section: exposure
    label: ISO
    control: select
    allow_custom: false
    source: https://cam.start.canon/en/C003/manual/html/UG-03_Shooting-1_0070.html
    note: Project model separating Canon AUTO from a manually selected ISO value.
    choices:
      - {value: Auto, label: AUTO, origin: canon}
      - {value: Fixed, label: Manual ISO value, origin: project_model}

  exposure.iso.value:
    section: exposure
    label: ISO Value
    control: combo
    allow_custom: true
    source: https://cam.start.canon/en/C003/manual/html/UG-03_Shooting-1_0070.html
    note: Canon values use 1/3-stop increments by default; custom profile targets may contain a range.
    choices:
      - {value: 50, label: "L (equivalent to ISO 50)", origin: canon, conditional: ISO expansion enabled}
      - {value: 100, label: ISO 100, origin: canon}
      - {value: 125, label: ISO 125, origin: canon}
      - {value: 160, label: ISO 160, origin: canon}
      - {value: 200, label: ISO 200, origin: canon}
      - {value: 250, label: ISO 250, origin: canon}
      - {value: 320, label: ISO 320, origin: canon}
      - {value: 400, label: ISO 400, origin: canon}
      - {value: 500, label: ISO 500, origin: canon}
      - {value: 640, label: ISO 640, origin: canon}
      - {value: 800, label: ISO 800, origin: canon}
      - {value: 1000, label: ISO 1000, origin: canon}
      - {value: 1250, label: ISO 1250, origin: canon}
      - {value: 1600, label: ISO 1600, origin: canon}
      - {value: 2000, label: ISO 2000, origin: canon}
      - {value: 2500, label: ISO 2500, origin: canon}
      - {value: 3200, label: ISO 3200, origin: canon}
      - {value: 4000, label: ISO 4000, origin: canon}
      - {value: 5000, label: ISO 5000, origin: canon}
      - {value: 6400, label: ISO 6400, origin: canon}
      - {value: 8000, label: ISO 8000, origin: canon}
      - {value: 10000, label: ISO 10000, origin: canon}
      - {value: 12800, label: ISO 12800, origin: canon}
      - {value: 16000, label: ISO 16000, origin: canon}
      - {value: 20000, label: ISO 20000, origin: canon}
      - {value: 25600, label: ISO 25600, origin: canon}
      - {value: 32000, label: ISO 32000, origin: canon}
      - {value: 40000, label: ISO 40000, origin: canon}
      - {value: 51200, label: ISO 51200, origin: canon}
      - {value: 102400, label: "H (equivalent to ISO 102400)", origin: canon, conditional: ISO expansion enabled}

  exposure.auto_iso.maximum:
    section: exposure
    label: Auto ISO Max
    control: select
    allow_custom: false
    source: https://cam.start.canon/en/C003/manual/html/UG-03_Shooting-1_0070.html
    note: Canon Auto ISO maximum choices use 1-stop increments.
    choices:
      - {value: 200, label: ISO 200, origin: canon}
      - {value: 400, label: ISO 400, origin: canon}
      - {value: 800, label: ISO 800, origin: canon}
      - {value: 1600, label: ISO 1600, origin: canon}
      - {value: 3200, label: ISO 3200, origin: canon}
      - {value: 6400, label: ISO 6400, origin: canon}
      - {value: 12800, label: ISO 12800, origin: canon}
      - {value: 25600, label: ISO 25600, origin: canon}
      - {value: 51200, label: ISO 51200, origin: canon}

  exposure.exposure_compensation:
    section: exposure
    label: Exposure Comp
    control: combo
    allow_custom: true
    source: https://cam.start.canon/en/C003/manual/html/UG-03_Shooting-1_0410.html
    note: Default 1/3-stop values are shown; Custom Function exposure increments can instead use 1/2-stop steps. Descriptive profile targets remain allowed.
    choices:
      - {value: "-3", label: "−3 EV", origin: canon}
      - {value: "-2 2/3", label: "−2⅔ EV", origin: canon}
      - {value: "-2 1/3", label: "−2⅓ EV", origin: canon}
      - {value: "-2", label: "−2 EV", origin: canon}
      - {value: "-1 2/3", label: "−1⅔ EV", origin: canon}
      - {value: "-1 1/3", label: "−1⅓ EV", origin: canon}
      - {value: "-1", label: "−1 EV", origin: canon}
      - {value: "-2/3", label: "−⅔ EV", origin: canon}
      - {value: "-1/3", label: "−⅓ EV", origin: canon}
      - {value: "0", label: "0 EV", origin: canon}
      - {value: "+1/3", label: "+⅓ EV", origin: canon}
      - {value: "+2/3", label: "+⅔ EV", origin: canon}
      - {value: "+1", label: "+1 EV", origin: canon}
      - {value: "+1 1/3", label: "+1⅓ EV", origin: canon}
      - {value: "+1 2/3", label: "+1⅔ EV", origin: canon}
      - {value: "+2", label: "+2 EV", origin: canon}
      - {value: "+2 1/3", label: "+2⅓ EV", origin: canon}
      - {value: "+2 2/3", label: "+2⅔ EV", origin: canon}
      - {value: "+3", label: "+3 EV", origin: canon}

  autofocus.operation:
    section: autofocus
    label: AF Operation
    control: select
    allow_custom: false
    source: https://cam.start.canon/en/C003/manual/html/UG-04_AF-Drive_0040.html
    note: Manual Focus is retained as a project compatibility value; Canon treats MF as focus mode, not AF Operation.
    choices:
      - {value: One-Shot AF, label: One-Shot AF, origin: canon}
      - {value: Servo AF, label: Servo AF, origin: canon}
      - {value: Manual Focus, label: Manual Focus, origin: project_extension}

  autofocus.servo_af_case:
    section: autofocus
    label: Servo AF Case
    control: select
    allow_custom: false
    source: https://cam.start.canon/en/C003/manual/html/UG-04_AF-Drive_0100.html
    choices:
      - {value: Case 1, label: "Case 1 — Versatile multi-purpose", origin: canon}
      - {value: Case 2, label: "Case 2 — Ignore possible obstacles", origin: canon}
      - {value: Case 3, label: "Case 3 — Subjects entering AF points", origin: canon}
      - {value: Case 4, label: "Case 4 — Acceleration/deceleration", origin: canon}
      - {value: Case A (Auto), label: "Case A — Automatic", origin: canon, canon_value: Case A}
      - {value: Case 1 (Custom), label: "Case 1 (Custom) — Project −1/+1 preset", origin: project_extension}

  autofocus.tracking_sensitivity:
    section: autofocus
    label: Tracking Sensitivity
    control: select
    allow_custom: false
    source: https://cam.start.canon/en/C003/manual/html/UG-04_AF-Drive_0100.html
    choices:
      - {value: Auto, label: Auto, origin: canon, conditional: Case A}
      - {value: "-2", label: "−2 — Locked on", origin: canon}
      - {value: "-1", label: "−1 — Locked on", origin: canon}
      - {value: "0", label: "0 — Standard", origin: canon}
      - {value: "+1", label: "+1 — Responsive", origin: canon}
      - {value: "+2", label: "+2 — Responsive", origin: canon}

  autofocus.accel_decel_tracking:
    section: autofocus
    label: Accel./Decel. Tracking
    control: select
    allow_custom: false
    source: https://cam.start.canon/en/C003/manual/html/UG-04_AF-Drive_0100.html
    choices:
      - {value: Auto, label: Auto, origin: canon, conditional: Case A}
      - {value: "-2", label: "−2 — Steady speed/obstruction", origin: canon}
      - {value: "-1", label: "−1 — Steady speed/obstruction", origin: canon}
      - {value: "0", label: "0 — Standard", origin: canon}
      - {value: "+1", label: "+1 — Speed changes", origin: canon}
      - {value: "+2", label: "+2 — Dramatic speed changes", origin: canon}

  autofocus.switching_tracked_subjects:
    section: autofocus
    label: Switching Tracked Subjects
    control: select
    allow_custom: false
    source: https://cam.start.canon/en/C003/manual/html/UG-04_AF-Drive_0110.html
    choices:
      - {value: Initial priority, label: Initial priority, origin: canon}
      - {value: On subject, label: On subject, origin: canon}
      - {value: Switch subject, label: Switch subject, origin: canon}

  autofocus.method:
    section: autofocus
    label: AF Method
    control: select
    allow_custom: false
    source: https://cam.start.canon/en/C003/manual/html/UG-04_AF-Drive_0050.html
    choices:
      - {value: Face + Tracking, label: Face+Tracking, origin: canon, canon_value: Face+Tracking}
      - {value: Spot AF, label: Spot AF, origin: canon}
      - {value: 1-Point AF, label: 1-point AF, origin: canon, canon_value: 1-point AF}
      - {value: Expand AF Area, label: Expand AF area, origin: canon, canon_value: Expand AF area}
      - {value: Expand AF Area Around, label: "Expand AF area: Around", origin: canon, canon_value: "Expand AF area: Around"}
      - {value: Zone AF, label: Zone AF, origin: canon}
      - {value: Large Zone AF (Vertical), label: "Large Zone AF: Vertical", origin: canon}
      - {value: Large Zone AF (Horizontal), label: "Large Zone AF: Horizontal", origin: canon}
      - {value: Not Used, label: Not Used (manual-focus profile), origin: project_extension}

  autofocus.subject_detection:
    section: autofocus
    label: Subject Detection
    control: select
    allow_custom: false
    source: https://cam.start.canon/en/C003/manual/html/UG-04_AF-Drive_0050.html
    choices:
      - {value: People, label: People, origin: canon}
      - {value: Animals, label: Animals, origin: canon}
      - {value: Vehicles, label: Vehicles, origin: canon}
      - {value: None, label: None, origin: canon}

  autofocus.eye_detection:
    section: autofocus
    label: Eye Detection
    control: select
    allow_custom: false
    source: https://cam.start.canon/en/C003/manual/html/UG-04_AF-Drive_0050.html
    choices:
      - {value: Enable, label: Enable, origin: canon}
      - {value: Disable, label: Disable, origin: canon}

  autofocus.touch_drag_af:
    section: autofocus
    label: Touch & Drag AF
    control: select
    allow_custom: false
    source: https://cam.start.canon/en/C003/manual/html/UG-04_AF-Drive_0080.html
    choices:
      - {value: Enable, label: Enable, origin: canon}
      - {value: Disable, label: Disable, origin: canon}

  autofocus.touch_drag_positioning_method:
    section: autofocus
    label: Touch & Drag AF — Positioning Method
    control: select
    allow_custom: false
    source: https://cam.start.canon/en/C003/manual/html/UG-04_AF-Drive_0080.html
    choices:
      - {value: Absolute, label: Absolute, origin: canon}
      - {value: Relative, label: Relative, origin: canon}

  autofocus.touch_drag_active_area:
    section: autofocus
    label: Touch & Drag AF — Active Touch Area
    control: select
    allow_custom: false
    source: https://cam.start.canon/en/C003/manual/html/UG-04_AF-Drive_0080.html
    choices:
      - {value: Whole panel, label: Whole panel, origin: canon}
      - {value: Left, label: Left, origin: canon}
      - {value: Right, label: Right, origin: canon}
      - {value: Top left, label: Top left, origin: canon}
      - {value: Top right, label: Top right, origin: canon}
      - {value: Bottom left, label: Bottom left, origin: canon}
      - {value: Bottom right, label: Bottom right, origin: canon}

  drive.mode:
    section: drive
    label: Drive
    control: select
    allow_custom: false
    source: https://cam.start.canon/en/C003/manual/html/UG-04_AF-Drive_0120.html
    choices:
      - {value: Single Shot, label: Single shooting, origin: canon, canon_value: Single shooting}
      - {value: High Speed Continuous+, label: High-speed continuous shooting +, origin: canon}
      - {value: High Speed Continuous, label: High-speed continuous shooting, origin: canon}
      - {value: Low Speed Continuous, label: Low-speed continuous shooting, origin: canon}
      - {value: "Self-timer: 10 sec./remote control", label: "Self-timer: 10 sec./remote control", origin: canon}
      - {value: "Self-timer: 2 sec./remote control", label: "Self-timer: 2 sec./remote control", origin: canon}

my_menu:
  source: https://cam.start.canon/en/C003/manual/html/UG-08_Custom_0050.html
  max_tabs: 5
  max_items_per_tab: 6
  recommended_tabs:
    - name: SWITCH
      items: [af1_subject_to_detect, shoot6_shutter_mode, shoot5_focus_bracketing, shoot7_is_mode, shoot1_cropping_aspect_ratio]
    - name: AF Case
      items: [af3_servo_af_characteristics, af3_tracking_sensitivity, af3_accel_decel_tracking, af4_switching_tracked_subjects]

reference_sections:
  - key: shooting
    label: Shooting 1–8
    source: https://cam.start.canon/en/C003/manual/html/UG-03_Shooting-1_0020.html
    items:
      - {id: shoot1_image_quality, label: Image quality, menu_location: "SHOOT1 → Image quality", canon_default: JPEG Large/Fine, recommended: cRAW, classification: Set Once, visit_again: When a job requires another format, note: "The project baseline uses cRAW for Lightroom processing.", my_menu_eligible: true}
      - {id: shoot1_dual_pixel_raw, label: Dual Pixel RAW, menu_location: "SHOOT1 → Dual Pixel RAW", canon_default: Disable, recommended: Disable, classification: Ignore, visit_again: Only for a tested DPRAW workflow, my_menu_eligible: true}
      - {id: shoot1_cropping_aspect_ratio, label: Cropping/aspect ratio, menu_location: "SHOOT1 → Cropping/aspect ratio", canon_default: Full-frame, recommended: Full-frame, classification: Situational, visit_again: Temporarily for predictable distant framing; restore afterward, note: "RF-S and EF-S lenses force 1.6× crop.", my_menu_eligible: true}
      - {id: shoot2_exposure_comp_aeb, label: Expo.comp./AEB, menu_location: "SHOOT2 → Expo.comp./AEB", canon_default: 0 EV / no bracketing, recommended: 0 EV / no bracketing, classification: Situational, visit_again: For deliberate compensation or exposure bracketing, my_menu_eligible: true}
      - {id: shoot2_iso_speed_settings, label: ISO speed settings, menu_location: "SHOOT2 → ISO speed settings", canon_default: Auto range varies by reset state, recommended: Auto ISO maximum 12800, classification: Set Once, visit_again: When noise or motion requirements change, my_menu_eligible: true}
      - {id: shoot2_hdr_pq, label: HDR PQ settings, menu_location: "SHOOT2 → HDR PQ settings", canon_default: Disable, recommended: Disable, classification: Ignore, visit_again: Only for an intentional HDR PQ/HEIF workflow, my_menu_eligible: true}
      - {id: shoot2_auto_lighting_optimizer, label: Auto Lighting Optimizer, menu_location: "SHOOT2 → Auto Lighting Optimizer", canon_default: Standard, recommended: Disable for RAW-first workflow, classification: Ignore, visit_again: For camera-generated JPEG/HEIF output, my_menu_eligible: true}
      - {id: shoot2_highlight_tone_priority, label: Highlight tone priority, menu_location: "SHOOT2 → Highlight tone priority", canon_default: Disable, recommended: Disable, classification: Situational, visit_again: For deliberate highlight protection after testing ISO constraints, my_menu_eligible: true}
      - {id: shoot2_anti_flicker, label: Anti-flicker shoot., menu_location: "SHOOT2 → Anti-flicker shoot.", canon_default: Disable, recommended: Disable until needed, classification: Situational, visit_again: Under flickering artificial light, my_menu_eligible: true}
      - {id: shoot2_speedlite_control, label: External Speedlite control, menu_location: "SHOOT2 → External Speedlite control", canon_default: Varies with attached flash, recommended: Configure for the active flash workflow, classification: Situational, visit_again: Whenever flash equipment changes, my_menu_eligible: true}
      - {id: shoot3_white_balance, label: White balance, menu_location: "SHOOT3 → White balance", canon_default: AWB, recommended: AWB, classification: Situational, visit_again: For controlled color or a fixed-light sequence, my_menu_eligible: true}
      - {id: shoot3_custom_white_balance, label: Custom White Balance, menu_location: "SHOOT3 → Custom White Balance", canon_default: Not registered, recommended: Leave unregistered until needed, classification: Situational, visit_again: For measured custom white balance, my_menu_eligible: true}
      - {id: shoot3_wb_shift_bracket, label: WB Shift/Bkt., menu_location: "SHOOT3 → WB Shift/Bkt.", canon_default: 0 / no bracketing, recommended: 0 / no bracketing, classification: Ignore, visit_again: Only for deliberate JPEG/HEIF color bracketing, my_menu_eligible: true}
      - {id: shoot3_color_space, label: Color space, menu_location: "SHOOT3 → Color space", canon_default: sRGB, recommended: sRGB, classification: Set Once, visit_again: Only when a managed Adobe RGB workflow requires it, my_menu_eligible: true}
      - {id: shoot3_picture_style, label: Picture Style, menu_location: "SHOOT3 → Picture Style", canon_default: Auto, recommended: Neutral, classification: Set Once, visit_again: For JPEG/HEIF output or preview rendering needs, my_menu_eligible: true}
      - {id: shoot3_clarity, label: Clarity, menu_location: "SHOOT3 → Clarity", canon_default: "0", recommended: "0", classification: Ignore, visit_again: Only for deliberate in-camera rendering, my_menu_eligible: true}
      - {id: shoot3_lens_aberration, label: Lens aberration correction, menu_location: "SHOOT3 → Lens aberration correction", canon_default: Corrections vary, recommended: Leave Canon defaults; verify per lens and RAW workflow, classification: Situational, visit_again: After changing lenses or output workflow, my_menu_eligible: true}
      - {id: shoot4_long_exposure_nr, label: Long exp. noise reduction, menu_location: "SHOOT4 → Long exp. noise reduction", canon_default: Disable, recommended: Disable, classification: Situational, visit_again: Enable only when dark-frame processing is worth the matching wait, my_menu_eligible: true}
      - {id: shoot4_high_iso_nr, label: High ISO speed NR, menu_location: "SHOOT4 → High ISO speed NR", canon_default: Standard, recommended: Disable, classification: Set Once, visit_again: For camera-generated JPEG/HEIF output, my_menu_eligible: true}
      - {id: shoot4_dust_delete_data, label: Dust Delete Data, menu_location: "SHOOT4 → Dust Delete Data", canon_default: No current acquisition, recommended: Leave unused for Lightroom-first workflow, classification: Ignore, visit_again: If adopting Canon dust-removal software, my_menu_eligible: true}
      - {id: shoot5_multiple_exposure, label: Multiple exposure, menu_location: "SHOOT5 → Multiple exposure", canon_default: Disable, recommended: Disable, classification: Situational, visit_again: For a planned in-camera composite; disable afterward, my_menu_eligible: true}
      - {id: shoot5_hdr_mode, label: HDR Mode, menu_location: "SHOOT5 → HDR Mode", canon_default: Disable HDR, recommended: Disable HDR, classification: Situational, visit_again: For a planned in-camera HDR result; disable afterward, my_menu_eligible: true}
      - {id: shoot5_focus_bracketing, label: Focus bracketing, menu_location: "SHOOT5 → Focus bracketing", canon_default: Disable, recommended: Disable until a bracketed stack, classification: Situational, visit_again: Macro or landscape focus stacks; disable afterward, my_menu_eligible: true}
      - {id: shoot5_ibis_high_res, label: IBIS High resolution shot, menu_location: "SHOOT5 → IBIS High resolution shot", canon_default: Disable, recommended: Disable, classification: Ignore, visit_again: Only for a fully static tested JPEG workflow, my_menu_eligible: true}
      - {id: shoot6_interval_timer, label: Interval timer, menu_location: "SHOOT6 → Interval timer", canon_default: Disable, recommended: Disable, classification: Situational, visit_again: For planned interval sequences; disable afterward, my_menu_eligible: true}
      - {id: shoot6_bulb_timer, label: Bulb timer, menu_location: "SHOOT6 → Bulb timer", canon_default: Disable, recommended: Disable, classification: Situational, visit_again: For timed Bulb exposures; disable afterward, my_menu_eligible: true}
      - {id: shoot6_shutter_mode, label: Shutter mode, menu_location: "SHOOT6 → Shutter mode", canon_default: Electronic 1st-curtain, recommended: Electronic 1st-curtain, classification: Situational, visit_again: Mechanical for specified fast-lens or flash profiles; Electronic only when its risks are acceptable, my_menu_eligible: true}
      - {id: shoot6_release_without_card, label: Release shutter without card, menu_location: "SHOOT6 → Release shutter without card", canon_default: Enable, recommended: Disable, classification: Set Once, visit_again: "No", note: "Disabling prevents an apparently successful exposure when no card is recording.", my_menu_eligible: true}
      - {id: shoot7_is_mode, label: IS (Image Stabilizer) mode, menu_location: "SHOOT7 → IS (Image Stabilizer) mode", canon_default: On / Still photo IS Always, recommended: Mode 1 / On, classification: Situational, visit_again: Tripod and lens-specific workflows, my_menu_eligible: true}
      - {id: shoot7_touch_shutter, label: Touch Shutter, menu_location: "SHOOT7 → Touch Shutter", canon_default: Disable, recommended: Disable, classification: Set Once, visit_again: Only for deliberate screen-triggered shooting, my_menu_eligible: true}
      - {id: shoot7_image_review, label: Image review, menu_location: "SHOOT7 → Image review", canon_default: 2 sec., recommended: 2 sec., classification: Set Once, visit_again: If review delay interrupts fast shooting, my_menu_eligible: true}
      - {id: shoot7_high_speed_display, label: High speed display, menu_location: "SHOOT7 → High speed display", canon_default: Disable, recommended: Enable, classification: Set Once, visit_again: If battery/display behavior is unsuitable, my_menu_eligible: true}
      - {id: shoot7_metering_timer, label: Metering timer, menu_location: "SHOOT7 → Metering timer", canon_default: 8 sec., recommended: 8 sec., classification: Set Once, visit_again: If controls time out too quickly or remain active too long, my_menu_eligible: true}
      - {id: shoot7_exposure_simulation, label: Expo. simulation, menu_location: "SHOOT7 → Expo. simulation", canon_default: Enable, recommended: Enable, classification: Set Once, visit_again: Disable situationally for studio flash visibility, my_menu_eligible: true}
      - {id: shoot7_shooting_info_display, label: Shooting info. disp., menu_location: "SHOOT7 → Shooting info. disp.", canon_default: Canon screen defaults, recommended: Screen modes 1–5 enabled; RGB histogram, classification: Set Once, visit_again: When refining INFO-screen workflow, my_menu_eligible: true}
      - {id: shoot8_vf_display_format, label: VF display format, menu_location: "SHOOT8 → VF display format", canon_default: Display 1, recommended: Display 1, classification: Set Once, visit_again: If a reduced image area improves visibility, my_menu_eligible: true}
      - {id: shoot8_display_performance, label: Disp. performance, menu_location: "SHOOT8 → Disp. performance", canon_default: Power saving, recommended: Smooth when responsiveness matters; Power saving otherwise, classification: Situational, visit_again: When battery life or motion rendering matters more, my_menu_eligible: true}

  - key: autofocus
    label: AF 1–5
    source: https://cam.start.canon/en/C003/manual/html/UG-04_AF-Drive_0020.html
    items:
      - {id: af1_af_operation, label: AF operation, menu_location: "AF1 → AF operation", canon_default: One-Shot AF, recommended: Servo AF baseline, classification: Situational, visit_again: Per subject profile, my_menu_eligible: true}
      - {id: af1_af_method, label: AF method, menu_location: "AF1 → AF method", canon_default: Face + Tracking, recommended: Face + Tracking baseline, classification: Situational, visit_again: Per subject and focusing task, my_menu_eligible: true}
      - {id: af1_subject_to_detect, label: Subject to detect, menu_location: "AF1 → Subject to detect", canon_default: People, recommended: Animals baseline; profile-specific overrides, classification: Situational, visit_again: Whenever the tracked subject class changes, my_menu_eligible: true}
